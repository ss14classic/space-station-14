# Light packages that contain multiple lights of a kind.
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseLightPackage
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,3,3
  - type: MultiHandedItem
  - type: EntityProvider
    canReceive: false
  - type: ContainerContainer
    containers:
      entity-provider: !type:Container
  - type: UserInterface
    interfaces:
      enum.EntityProviderUiKey.Key:
        type: EntityProviderBoundUserInterface
  - type: Sprite
    sprite: Objects/Storage/EntityProvider/packaged_lights.rsi
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 100
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.EntityProviderVisualsKey.Key:
        emptyLayer:
          Full: { visible: false }
          Opened: { visible: false }
          Empty: { visible: true }


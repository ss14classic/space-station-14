# Classic: wizden defines the Respritening's tile items here.
# Only the new plastic tiles from #45525 are kept.

- type: entity
  parent: FloorTileItemSteel
  id: FloorTileItemPlastic
  name: plastic floor
  components:
  - type: Sprite
    state: steel-plastic
  - type: FloorTile
    outputs:
    - Plating
    - FloorPlastic
  - type: Stack
    stackType: FloorTileStackPlastic

- type: entity
  parent: FloorTileItemDark
  id: FloorTileItemDarkPlastic
  name: dark plastic floor
  components:
  - type: Sprite
    state: dark-plastic
  - type: FloorTile
    outputs:
    - Plating
    - FloorDarkPlastic
  - type: Stack
    stackType: FloorTileStackDarkPlastic

- type: entity
  parent: FloorTileItemWhite
  id: FloorTileItemWhitePlastic
  name: white plastic floor
  components:
  - type: Sprite
    state: white-plastic
  - type: FloorTile
    outputs:
    - Plating
    - FloorWhitePlastic
  - type: Stack
    stackType: FloorTileStackWhitePlastic

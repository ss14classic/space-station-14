- type: entity
  parent: [BaseDeltaPressureReinforcedGlass, BaseWindowStructure, BaseRCDResistant, StructureHealthBarrierStrong]
  id: ShuttleWindow
  name: shuttle window
  components:
  - type: Sprite
  # Classic: Respritening renamed.
    sprite: Structures/Windows/shuttle_window.rsi
  - type: Icon
  # Classic: Respritening renamed.
    sprite: Structures/Windows/shuttle_window.rsi
    state: full
  - type: Repairable
    fuelCost: 15
    doAfterDelay: 3
  - type: Damageable
    damageModifierSet: PlasteelMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassReinforced:
            min: 1
            max: 2
          PartRodMetal:
            min: 1
            max: 2
  - type: IconSmooth
    states:
    - !type:CornerSpriteSmoothing
    # Classic: Windows don't smooth with walls.
      mask: [ windows, grilles, marble, doors ]
      base: swindow
  - type: Construction
    graph: Window
    node: shuttleWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 20
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 150

- type: entity
  parent: ShuttleWindow
  id: ShuttleWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  - type: Sprite
    drawdepth: WallTops
  # Classic: Respritening renamed.
    sprite: Structures/Windows/shuttle_window_diagonal.rsi
  - type: Tag
    tags:
    - Diagonal
    - Window
  - type: IconSmooth
  # Classic: Restored smoothing group.
    key: windows
    states:
    - !type:DiagonalSpriteSmoothing
    # Classic: Windows don't smooth with walls.
      mask: [ windows, grilles, marble, doors ]
      base: state
  - type: Icon
  # Classic: Respritening renamed.
    sprite: Structures/Windows/shuttle_window_diagonal.rsi
    state: state0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi

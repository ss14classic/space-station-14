- type: entity
  abstract: true
  parent: BaseWallmountMetallic
  id: BaseStationMap
  suffix: Wall
  components:
  - type: Sprite
  # Classic: Respritening renamed.
    sprite: Structures/Machines/station_map.rsi
#    offset: 0, -0.25 # Classic: Removed.
    drawdepth: WallMountedItems
  - type: WallMount
    arc: 360
  - type: Construction
    graph: StationMap
    containers:
    - board
  - type: ContainerContainer
    containers:
      board: !type:Container

- type: entity
  parent: [ BaseStationMap, StructureHealthMachineFlimsy ]
  id: StationMapBroken
  name: station map
  description: A former map of the surrounding station.
  suffix: Wall broken
  components:
  - type: Sprite
    layers:
  # Classic: Restored state.
    - state: station_map_broken
  - type: Destructible
    thresholds:
    - trigger: &DamageMachineFlimsy
        !type:DamageTrigger
        damage: 50
      behaviors:
      - &SoundMetalGlassBreak !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: &Min0Max1
            min: 0
            max: 1
          CableApcStack1: *Min0Max1
  - type: Construction
    node: broken
  - type: EntityTableContainerFill
    contextContainers: true
    containers:
      board:
        id: StationMapCircuitboard
        prob: 0.25 # The board is probably broken
        conditions:
        - !type:EmptyContainerCondition # If this entity is spawned via construction the circuitboard already exists

- type: entity
  parent: [ BaseStationMap, BaseWallmountMachine, StructureHealthMachineWeak ]
  id: StationMap
  name: station map
  description: A virtual map of the surrounding station.
  components:
  - type: Appearance
  - type: StationMap
  - type: Sprite
    layers:
  # Classic: Restored state.
    - state: station_map0
    - state: unshaded
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Icon
  # Classic: Respritening renamed.
    sprite: Structures/Machines/station_map.rsi
  # Classic: Restored state.
    state: station_map0
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: EntityTableContainerFill
    contextContainers: true
    containers:
      board:
        id: StationMapCircuitboard
        conditions:
        - !type:EmptyContainerCondition
  - type: ApcPowerReceiver
    powerLoad: 50
  - type: PowerState
    idlePowerDraw: 50
    workingPowerDraw: 200
  - type: UIPowerState
  - type: Construction
    node: station_map
  - type: ActivatableUIRequiresPower
  - type: ActivatableUI
    key: enum.StationMapUiKey.Key
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - *SoundMetalGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: broken
  - type: UserInterface
    interfaces:
      enum.StationMapUiKey.Key:
        type: StationMapBoundUserInterface
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound

- type: entity
  parent: [ BaseStationMap, StructureHealthMachineFlimsy ]
  id: StationMapAssembly
  name: station map assembly
  description: A station map assembly.
  components:
  - type: Sprite
    layers:
  # Classic: Restored state.
    - state: station_map_frame1
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
  # Classic: Restored states.
          assembly: { state: station_map_frame0 }
          wired: { state: station_map_frame1 }
          electronics: { state: station_map_frame2 }
  # Classic: No classic sprite for this step, reuses the last frame.
          screen: { state: station_map_frame2 }
  - type: Construction
    node: assembly
  - type: Destructible
    thresholds:
    - trigger: *DamageMachineFlimsy
      behaviors:
      - *SoundMetalGlassBreak
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: *Min0Max1
